// ------------------------------
// 1. Simple Perlin Noise
// ------------------------------
class Perlin {
  constructor() { this.gradients = {}; this.memory = {}; }
  rand_vect() { const t = Math.random()*2*Math.PI; return {x:Math.cos(t), y:Math.sin(t)}; }
  dot_prod_grid(x,y,vx,vy){
    let g=this.gradients[[vx,vy]]||(this.gradients[[vx,vy]]=this.rand_vect());
    return (x-vx)*g.x + (y-vy)*g.y;
  }
  smootherstep(x){ return 6*x**5 - 15*x**4 + 10*x**3; }
  interp(x,a,b){ return a + this.smootherstep(x)*(b-a); }
  get(x,y){
    if(this.memory[[x,y]]) return this.memory[[x,y]];
    const xf=Math.floor(x), yf=Math.floor(y);
    const tl=this.dot_prod_grid(x,y,xf,yf);
    const tr=this.dot_prod_grid(x,y,xf+1,yf);
    const bl=this.dot_prod_grid(x,y,xf,yf+1);
    const br=this.dot_prod_grid(x,y,xf+1,yf+1);
    const xt=this.interp(x-xf,tl,tr);
    const xb=this.interp(x-xf,bl,br);
    const v=this.interp(y-yf,xt,xb);
    this.memory[[x,y]]=v;
    return v;
  }
}
const perlin = new Perlin();

// ------------------------------
// 2. Hex math
// ------------------------------
const hexSize = 20;
const sectorHexSize = 50;

function hexToPixel(q, r, size) {
  return {
    x: size * Math.sqrt(3) * (q + r/2),
    y: size * 1.5 * r
  };
}

function drawHex(ctx, x, y, size, color) {
  const angle = Math.PI/3;
  const rotation = Math.PI/6; // 30 degrees

  ctx.beginPath();
  for (let i=0;i<6;i++){
    const px = x + size*Math.cos(angle*i + rotation);
    const py = y + size*Math.sin(angle*i + rotation);
    if(i===0) ctx.moveTo(px,py);
    else ctx.lineTo(px,py);
  }
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();

  ctx.lineWidth = 1;
  ctx.lineJoin = "round";
  ctx.strokeStyle = "black";
  ctx.stroke();
}

function drawSelectedBorder(ctx, x, y, size) {
  const angle = Math.PI / 3;
  const rotation = Math.PI / 6;

  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const px = x + size * Math.cos(angle * i + rotation);
    const py = y + size * Math.sin(angle * i + rotation);
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();

  ctx.lineWidth = 3;
  ctx.strokeStyle = "blue";
  ctx.stroke();
}

function hexDistance(a, b) {
  return (Math.abs(a.q - b.q)
        + Math.abs(a.r - b.r)
        + Math.abs((a.q + a.r) - (b.q + b.r))) / 2;
}

// ------------------------------
// 3. Generate contiguous organic map
// ------------------------------
let currentViewMode = "world"; // "world" or "sector"
let currentSectorView = null;  
let selectedPlanetId = null;

function generateMap() {
  const targetHexCount = 200;
  const noiseScale = 0.2;

  const queue = [];
  const visited = new Set();
  const hexes = [];

  queue.push({q:0, r:0});
  visited.add("0,0");

  while (queue.length > 0 && hexes.length < targetHexCount) {
    const {q, r} = queue.shift();
    const noise = perlin.get(q*noiseScale, r*noiseScale);
    hexes.push({
        q,
        r,
        noise,
        sectorInfluence: {},
        sectorOwner: null,
        hasAssignedDice: false,
        ownerType: null,
        politicalProfile: ["None", "None", "None"],
        lastPowerActivity: [],
    });

    const neighbors = [
      {q:q+1, r:r},
      {q:q-1, r:r},
      {q:q,   r:r+1},
      {q:q,   r:r-1},
      {q:q+1, r:r-1},
      {q:q-1, r:r+1}
    ];

    neighbors.forEach(n => {
      const key = `${n.q},${n.r}`;
      if (!visited.has(key)) {
        visited.add(key);
        const nNoise = perlin.get(n.q*noiseScale, n.r*noiseScale);
        if (nNoise > -0.3) queue.push(n);
      }
    });
  }

  // ------------------------------
  // 4. Voronoi Regions
  // ------------------------------
  const REGION_COUNT = 5;
  mapRegion = Array.from({ length: REGION_COUNT }, () => ({
    sectorIds: [],
    owner: null,
    regionInfluence: {},
    politicalProfile: ["None", "None", "None"],
    lastPowerActivity: [],
  }));

  const seeds = [];
  for (let i = 0; i < REGION_COUNT; i++) {
    seeds.push(hexes[Math.floor(Math.random() * hexes.length)]);
  }

  hexes.forEach(hex => {
    let bestSeed = 0;
    let bestDist = Infinity;

    seeds.forEach((seed, index) => {
      const d = hexDistance(hex, seed);
      if (d < bestDist) {
        bestDist = d;
        bestSeed = index;
      }
    });

    hex.region = bestSeed;
  });


  // ------------------------------
  // 5. Add planets to each hex (sector)
  // ------------------------------
  
  hexes.forEach((hex, index) => {
    hex.sectorId = index;
    mapRegion[hex.region].sectorIds.push(hex.sectorId);


    const planetTypes = ["Planet1", "Planet2", "Planet3", "Planet4", "Planet5", "Planet6"];
    const moonTypes   = ["Moon1", "Moon2", "Moon3"];
    const basePlanetCount = Math.floor(Math.random() * 7) + 3; // 3–9
    hex.planets = [];

    let planetIndex = 0;

    for (let i = 0; i < basePlanetCount; i++) {
      const imageId = planetTypes[Math.floor(Math.random() * planetTypes.length)];

      // Create the main planet
      const planet = {
        id: `P-${index}-${planetIndex++}`,
        name: `Planet ${planetIndex}`,
        imageId,
        hasPosition: false,
        assignedDice: [],
        hasAssignedDice: false,
        owner: null,
        ownerType: null
      };

      hex.planets.push(planet);

      // --- Special Case: Planet1 gets 1 moon ---
      if (imageId === "Planet1") {
        const moonImage = moonTypes[Math.floor(Math.random() * moonTypes.length)];

        hex.planets.push({
          id: `P-${index}-${planetIndex++}`,
          name: `Moon ${planetIndex}`,
          imageId: moonImage,
          parentId: planet.id,
          hasPosition: false,
          assignedDice: [],
          hasAssignedDice: false,
          owner: null,
          ownerType: null
        });
      }

      // --- Special Case: Planet5 gets 4–6 moons ---
      if (imageId === "Planet5") {
        const moonCount = Math.floor(Math.random() * 3) + 4; // 4–6 moons

        for (let m = 0; m < moonCount; m++) {
          const moonImage = moonTypes[Math.floor(Math.random() * moonTypes.length)];

          hex.planets.push({
            id: `P-${index}-${planetIndex++}`,
            name: `Moon ${planetIndex}`,
            imageId: moonImage,
            parentId: planet.id,
            hasPosition: false,
            assignedDice: [],
            hasAssignedDice: false,
            owner: null,
            ownerType: null
          });
        }
      }
    }
  });

  return { hexes, REGION_COUNT };
}

// ------------------------------
// 6. Draw map
// ------------------------------
const planetImages = {};
function loadPlanetImages() {
  const ids = [
    "Planet1", "Planet2", "Planet3", "Planet4", "Planet5", "Planet6",
    "Moon1", "Moon2", "Moon3"
  ];

  ids.forEach(id => {
    const img = new Image();
    img.src = `assets/planets/${id}.png`;
    planetImages[id] = img;
  });
}
loadPlanetImages();

function drawMap(mapData) {
  const canvas = document.getElementById("mapCanvas");
  const ctx = canvas.getContext("2d");

  const regionColors = [
    "rgb(180,150,150)",
    "rgb(150,180,150)",
    "rgb(150,150,180)",
    "rgb(180,180,150)",
    "rgb(180,150,180)"
  ];

  ctx.clearRect(0,0,canvas.width,canvas.height);

  mapData.hexes.forEach(hex => {
    const {x,y} = hexToPixel(hex.q, hex.r, hexSize);
    const cx = x + canvas.width/2;
    const cy = y + canvas.height/2;

    const color = regionColors[hex.region];
    drawHex(ctx, cx, cy, hexSize, color);

    hex.pixelX = cx;
    hex.pixelY = cy;

    if (hex.hasAssignedDice) {
      drawOverlayIcon(ctx, cx, cy, hexSize, hex.ownerType);
    }
  });
}

function drawOverlayIcon(ctx, x, y, size, ownerType) {
  const radius = Math.sqrt(size) * 1.7;
  const offsetY = size * 0.45;

  ctx.beginPath();
  ctx.arc(x, y + offsetY, radius, 0, 2 * Math.PI);

  ctx.fillStyle = ownerType === "player" ? "#2F6DB3" : "#8B1E1E";
  ctx.fill();

  ctx.strokeStyle = "#fff";
  ctx.lineWidth = 2;
  ctx.stroke();
}

function drawSectorMap(hex) {
  const canvas = document.getElementById("mapCanvas");
  const ctx = canvas.getContext("2d");

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const planets = hex.planets;


  const mainPlanets = hex.planets.filter(p => !p.parentId);
  const moonPlanets = hex.planets.filter(p => p.parentId);

  const mainCount = mainPlanets.length;

  // radius of the main ring
  const mainRadius = 2; // axial distance

  mainPlanets.forEach((planet, i) => {
    const angle = (2 * Math.PI * i) / mainCount;

    // convert angle → axial coordinates
    const q = Math.round(mainRadius * Math.cos(angle));
    const r = Math.round(mainRadius * Math.sin(angle));

    if (!planet.hasPosition) {
      const spot = findFreeSpot(hex.planets, q, r);
      planet.q = spot.q;
      planet.r = spot.r;
      planet.hasPosition = true;
    }
  });

  moonPlanets.forEach((moon, i) => {
    const parent = hex.planets.find(p => p.id === moon.parentId);

    const moonIndex = i; // or use a counter per parent
    const moonCount = moonPlanets.filter(m => m.parentId === parent.id).length;

    const angle = (2 * Math.PI * moonIndex) / moonCount;

    const moonRadius = 1; // small ring around parent

    let q = parent.q + Math.round(moonRadius * Math.cos(angle));
    let r = parent.r + Math.round(moonRadius * Math.sin(angle));

    if (!moon.hasPosition) {
      const spot = findFreeSpot(hex.planets, q, r);
      moon.q = spot.q;
      moon.r = spot.r;
      moon.hasPosition = true;
    }
  });

  hex.planets.forEach(planet => {
    const { x, y } = hexToPixel(planet.q, planet.r, sectorHexSize);

    planet.pixelX = x + canvas.width / 2;
    planet.pixelY = y + canvas.height / 2;

    // draw hex
    const isSelected = (planet.id === selectedPlanetId);
    const fillColor = isSelected ? "#777" : "#333";

    drawHex(ctx, planet.pixelX, planet.pixelY, sectorHexSize, fillColor);

    const img = planetImages[planet.imageId];
    if (img.complete) {
      ctx.drawImage(
        img,
        planet.pixelX - sectorHexSize * 0.6,
        planet.pixelY - sectorHexSize * 0.6,
        sectorHexSize * 1.2,
        sectorHexSize * 1.2
      );
    } else {
      img.onload = () => {
        ctx.drawImage(
          img,
          planet.pixelX - sectorHexSize * 0.6,
          planet.pixelY - sectorHexSize * 0.6,
          sectorHexSize * 1.2,
          sectorHexSize * 1.2
        );
      };
    }

    if (isSelected) {
      drawSelectedBorder(ctx, planet.pixelX, planet.pixelY, sectorHexSize);
    }

    if (planet.hasAssignedDice) {
      drawOverlayIcon(ctx, planet.pixelX, planet.pixelY, sectorHexSize, planet.ownerType);
    }
  });

  drawBackArrow(ctx);
}
function isOccupied(planets, q, r) {
  return planets.some(p => p.q === q && p.r === r);
}
function findFreeSpot(planets, q, r) {
  if (!isOccupied(planets, q, r)) return { q, r };

  // Spiral search outward
  const directions = [
    {q: 1, r: 0}, {q: 1, r: -1}, {q: 0, r: -1},
    {q: -1, r: 0}, {q: -1, r: 1}, {q: 0, r: 1}
  ];

  let radius = 1;

  while (radius < 10) { // safe limit
    for (let d = 0; d < 6; d++) {
      for (let step = 0; step < radius; step++) {
        q += directions[d].q;
        r += directions[d].r;

        if (!isOccupied(planets, q, r)) {
          return { q, r };
        }
      }
    }
    radius++;
  }

  // fallback (should never happen)
  return { q: q + 1, r };
}



function drawBackArrow(ctx) {
  ctx.fillStyle = "#fff";
  ctx.font = "24px sans-serif";
  ctx.fillText("⬅", 20, 40);

  // store clickable area
  window.backArrowBounds = { x: 20, y: 20, w: 40, h: 40 };
}

// ------------------------------
// 7. Click interaction
// ------------------------------
function getHexAtPixel(mapData, px, py) {
  for (const hex of mapData.hexes) {
    const dx = px - hex.pixelX;
    const dy = py - hex.pixelY;
    const dist = Math.sqrt(dx*dx + dy*dy);

    if (dist < hexSize * 1.1) {
      return hex;
    }
  }
  return null;
}

function getPlanetAtPixel(hex, px, py, size) {
  for (const planet of hex.planets) {
    const dx = px - planet.pixelX;
    const dy = py - planet.pixelY;
    const dist = Math.sqrt(dx*dx + dy*dy);

    if (dist < size) return planet;
  }
  return null;
}

function setupClick(mapData) {
  const canvas = document.getElementById("mapCanvas");
  const info = document.getElementById("hexInfo");

  canvas.onclick = (e) => {
    const rect = canvas.getBoundingClientRect();
    const px = e.clientX - rect.left;
    const py = e.clientY - rect.top;

    if (currentViewMode === "world") {
      const hex = getHexAtPixel(mapData, px, py);

      if (hex) {
        currentViewMode = "sector";
        currentSectorView = hex;

        renderSectorInfo(hex); // Existing text panel, contains Back Button. Will eventually be obsolete.
        drawSectorMap(hex);
      };
    } else if (currentViewMode === "sector") {
      const b = window.backArrowBounds;
      if (px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h) {
        returnToWorldMap();
        return;
      }

      // Planet clicks
      const planet = getPlanetAtPixel(currentSectorView, px, py, sectorHexSize);
      if (planet) {
        viewPlanet(currentSectorView.sectorId, planet.id);
        selectedPlanetId = planet.id;
        drawSectorMap(currentSectorView);
        return;
      }
    }
  }

  canvas.addEventListener("mousemove", (e) => {
    const rect = canvas.getBoundingClientRect();
    const px = e.clientX - rect.left;
    const py = e.clientY - rect.top;
    const pagx = e.pageX;
    const pagy = e.pageY;

    handleHover(px, py, pagx, pagy);
  });
}

function handleHover(px, py, pagx, pagy) {
  const tooltip = document.getElementById("hoverTooltip");

  if (currentViewMode === "world") {
    const hex = getHexAtPixel(currentMap, px, py);
    if (hex) {
      const sectorOwner = currentMap.playersById[hex.sectorOwner];
      const region = mapRegion[hex.region];
      const regionOwner = currentMap.playersById[region.owner];
      tooltip.style.display = "block";
      tooltip.style.left = (pagx - 150) + "px";
      tooltip.style.top = (pagy - 100) + "px";

      tooltip.innerHTML = `
        <strong>Sector ${hex.sectorId}</strong><br>
        Region: ${hex.region}<br>
        <hr />
        <strong>Region Control</strong><br>

function pickWeightedDie(weights) {
  const roll = Math.random();
  let cumulative = 0;

  for (const entry of weights) {
    cumulative += entry.weight;
    if (roll <= cumulative) {
      return entry.sides;
    }
  }

  // fallback (should never hit)
  return weights[0].sides;
}

function generateRandomDice(count = 10, packType = "standard", forcedFaction = null, ownerId) {
  const dice = [];
  const pack = dicePackTypes[packType];

  for (let i = 0; i < count; i++) {
    const sides = pickWeightedDie(pack.weights);

    // If faction is forced, find the matching power entry
    let powerIndex;
    if (forcedFaction) {
      powerIndex = powers.findIndex(p => p.name === forcedFaction);
    } else {
      powerIndex = Math.floor(Math.random() * powers.length);
    }

    const power = powers[powerIndex];

    const die = {
      id: `D-${Date.now()}-${currentMap.nextDieId++}`,
      sides,
      power: powerIndex,
      ownerId: ownerId,
      name: `${power.name} d${sides}`,
      color: power.color
    };

    dice.push(die);

    currentMap.playersById[ownerId].ownedDiceIds.add(die.id)
    currentMap.playersById[ownerId].availableDiceIds.add(die.id)    
  }

  return dice;
}

function assignDiceToPlanet(sectorId, planetId) {

function confirmDiceAssignment() {
  const ctx = diceSelectionContext;
  if (!ctx) return;

  const player = currentMap.playersById[currentPlayerId];

  const hex = currentMap.hexes.find(h => h.sectorId == ctx.sectorId);
  const region = mapRegion[hex.region];
  const planet = hex.planets.find(p => p.id == ctx.planetId);

  const oldSectorOwner = hex.sectorOwner;
  let sectorGain = 0;
  const oldRegionOwner = region.owner;
  let regionGain = 0;

  const sizes = [4, 6, 8, 10, 12, 20];

  ctx.selectedCategories.forEach(cat => {
    const { powerIndex, sizeIndex } = cat;
    const targetSize = sizes[sizeIndex];

    // ⭐ Find matching dice from player's availableDiceIds
    const candidates = [...player.availableDiceIds]
      .map(id => currentMap.diceList[id])
      .filter(d => d.power === powerIndex && d.sides === targetSize);

    if (candidates.length > 0) {
      // Pick one (random for now)
      const die = candidates[Math.floor(Math.random() * candidates.length)];

      // Assign it
      planet.assignedDice.push(die);

      if (planet.assignedDice.length > 0) {
        hex.hasAssignedDice = true;
        hex.ownerType = "player";

        planet.hasAssignedDice = true;
        planet.owner = currentPlayerId;
        planet.ownerType = "player";

        drawSectorMap(hex);
      }

      // ⭐ Remove from player's available pool
      player.availableDiceIds.delete(die.id);

      // ⭐ Influence scoring
      const roll = rollDie(die);

      sectorGain = calculateInfluenceGain(die, hex.politicalProfile, roll);
      hex.sectorInfluence[currentPlayerId] =
        (hex.sectorInfluence[currentPlayerId] ?? 0) + sectorGain;

      hex.sectorOwner = getSectorOwner(hex);

      regionGain = calculateInfluenceGain(die, region.politicalProfile, roll);
      region.regionInfluence[currentPlayerId] =
        (region.regionInfluence[currentPlayerId] ?? 0) + regionGain;

      region.owner = getRegionOwner(region);
    }
  });

  diceSelectionContext = null;

  // ⭐ Recalculate political profiles only when needed
  if (hex.sectorOwner !== oldSectorOwner || oldSectorOwner === currentPlayerId) {
    setPoliticalProfile(hex, { type: "sector", hex });
  }

  if (region.owner !== oldRegionOwner || oldRegionOwner === currentPlayerId) {
    setPoliticalProfile(region, { type: "region", region });
  }

  const cpuSummary = cpuTakeTurn("cpu-1");
  viewPlanet(ctx.sectorId, ctx.planetId, sectorGain, regionGain, cpuSummary);
}

    const profileName = powers[profilePowerIndex].name;

    } else if (result === "cpu") {
      modifiedRoll /= 2;
    } else {

  });

  modifiedRoll = Math.max(1, Math.floor(modifiedRoll));

  return modifiedRoll;
}

function getSectorOwner(hex) {
  const entries = Object.entries(hex.sectorInfluence);
  if (entries.length === 0) return null;

  let [topPlayerId, topValue] = entries[0];

  for (const [playerId, value] of entries) {
    if (value > topValue) {
      topPlayerId = playerId;
      topValue = value;
    }
  }

  return topPlayerId;
}
function getRegionOwner(region) {
  const entries = Object.entries(region.regionInfluence);
  if (entries.length === 0) return null;

  let [topPlayerId, topValue] = entries[0];

  for (const [playerId, value] of entries) {
    if (value > topValue) {
      topPlayerId = playerId;
      topValue = value;
    }
  }

  return topPlayerId;
}

function setPoliticalProfile(entity, scope) {
  // 0. Convert Scope to strengths?
  const strengths = powers.map((p, index) =>
    getFactionStrength(scope, index)
  );
  // 1. Gather strength for each power
  const total = strengths.reduce((a, b) => a + b, 0);

  // If no dice, clear profile
  if (total === 0) {
    entity.politicalProfile = ["None", "None", "None"];
    return;
  }

  // 2. Droop quota
  const quota = Math.round(total / 4);

  // 3. Guaranteed seats + remainders
  const guaranteed = strengths.map(s => Math.floor(s / quota));
  const remainders = strengths.map(s => s % quota);

  // 4. Collect guaranteed seats
  let seats = [];
  guaranteed.forEach((count, index) => {
    for (let i = 0; i < count; i++) {
      seats.push(powers[index].name);
    }
  });

  // 5. Fill remaining seats using remainder only (for now)
  if (seats.length < 3) {
    const remaining = powers
      .map((p, index) => ({ name: p.name, remainder: remainders[index], index }))
      .sort((a, b) => b.remainder - a.remainder);

    const seatsNeeded = 3 - seats.length
    for (let i = 0; i < seatsNeeded; i++) {
      seats.push(remaining[i].name);
    }
  }

  // 6. Store final profile
  entity.politicalProfile = seats.slice(0, 3);
}

function getFactionStrength(scope, powerIndex) {
  let total = 0;
  if (scope.type === "sector") {
    const ownerId = scope.hex.sectorOwner;

    // scope.hex is the sector hex
    scope.hex.planets.forEach(planet => {
      planet.assignedDice.forEach(d => {
        if (d.ownerId === ownerId && d.power === powerIndex) {
          total += d.sides;
        }
      });
    });
  }

  if (scope.type === "region") {
    const ownerId = scope.region.owner;

    scope.region.sectorIds.forEach(sectorId => {
      const hex = currentMap.hexes[sectorId];
      hex.planets.forEach(planet => {
        planet.assignedDice.forEach(d => {
          if (d.ownerId === ownerId && d.power === powerIndex) {
            total += d.sides;
          }
        });
      });
    });
  }

  return total;
}

function showAvailableDice(selectionMode = false, showAll = false) {
  const info = document.getElementById("hexInfo");

  const player = currentMap.playersById[currentPlayerId];

  // Choose which dice pool to display
  const diceIds = showAll
    ? Array.from(player.ownedDiceIds)          // full collection
    : Array.from(player.availableDiceIds);     // available only

  if (!player || diceIds.length === 0) {
    info.innerHTML = `<p>No ${showAll ? "owned" : "available"} dice.</p>`;
    return;
  }

  const sizes = [4, 6, 8, 10, 12, 20];

  // Build matrix of dice lists
  const matrix = Array.from({ length: powers.length }, () =>
    Array.from({ length: sizes.length }, () => [])
  );

  // Convert IDs → dice objects
  diceIds.forEach(id => {
    const die = currentMap.diceList[id];
    if (!die) return;

    const powerIndex = die.power;
    const sizeIndex = sizes.indexOf(die.sides);
    matrix[powerIndex][sizeIndex].push(die);
  });

  let html = `
    <h3>
      ${showAll ? "Dice Collection" : (selectionMode ? "Select Dice to Assign" : "Available Dice")}
    </h3>

    <button onclick="showAvailableDice(${selectionMode}, ${!showAll})">
      ${showAll ? "Show Available Dice" : "Show Full Collection"}
    </button>

    <table style="border-collapse: collapse; text-align: center; margin-top:10px;">
      <tr>
        <th style="padding: 6px; border: 1px solid #555;"></th>
        ${sizes.map(s => `<th style="padding: 6px; border: 1px solid #555;">d${s}</th>`).join("")}
      </tr>
  `;

  matrix.forEach((row, powerIndex) => {
    html += `
      <tr>
        <td style="padding: 6px; border: 1px solid #555; color:${powers[powerIndex].color}; font-weight:bold;">
          ${powers[powerIndex].name}
        </td>
        ${row.map((diceList, sizeIndex) => `
          <td style="padding: 6px; border: 1px solid #555;">
            ${diceList.length > 0 ? diceList.length : ""}
            ${
              selectionMode &&
              diceList.length > 0 &&
              !showAll
                ? `<br><input type="checkbox"
                     onchange="toggleDiceCategorySelection(${powerIndex}, ${sizeIndex})">`
                : ""
            }
          </td>
        `).join("")}
      </tr>
    `;
  });

  html += "</table>";

  if (selectionMode && !showAll) {
    html += `
      <button onclick="confirmDiceAssignment()">Confirm Assignment</button>
      <button onclick="cancelAssignment()">Cancel</button>
    `;
  }

  info.innerHTML = html;
}

function toggleDiceCategorySelection(powerIndex, sizeIndex) {
  const ctx = diceSelectionContext;
  if (!ctx) return;

  const key = `${powerIndex}-${sizeIndex}`;
  const existing = ctx.selectedCategories.find(c => c.key === key);

  if (!existing) {
    if (ctx.selectedCategories.length < 3) {
      ctx.selectedCategories.push({ key, powerIndex, sizeIndex });
    } else {
      alert("You can only assign up to 3 dice.");
      // Uncheck the box
      document.querySelector(`input[onchange="toggleDiceCategorySelection(${powerIndex}, ${sizeIndex})"]`).checked = false;
    }
  } else {
    ctx.selectedCategories = ctx.selectedCategories.filter(c => c.key !== key);
  }
}

function saveGame() {
  if (!currentMap) return alert("No map to save.");

  // Deep clone the map so we don't mutate the live game state
  const mapToSave = JSON.parse(JSON.stringify(currentMap));

  // Convert Sets → Arrays for every player
  Object.values(mapToSave.playersById).forEach(player => {
    player.availableDiceIds = Array.from(currentMap.playersById[player.id].availableDiceIds);
    player.ownedDiceIds = Array.from(currentMap.playersById[player.id].ownedDiceIds);
  });

  mapToSave.mapRegion = mapRegion;

  localStorage.setItem("savedMap", JSON.stringify(mapToSave));
  alert("Game saved.");
}

function loadGame() {
  const saved = localStorage.getItem("savedMap");
  if (!saved) return alert("No saved game found.");

  enableTopButtons();

  currentMap = JSON.parse(saved);
  Object.values(currentMap.playersById).forEach(player => {
    player.availableDiceIds = new Set(player.availableDiceIds || []);
    player.ownedDiceIds = new Set(player.ownedDiceIds || []);
  });

  mapRegion = currentMap.mapRegion;

  returnToWorldMap();
  setupClick(currentMap);

  document.getElementById("hexInfo").innerHTML = `
    <h3>Game Loaded</h3>
  `;

  updateCurrencyDisplay();
}

// ------------------------------
// 15. CPU Enclave
// ------------------------------

function seedCpuEnclave(cpuId, count = 3) {
  const cpu = currentMap.playersById[cpuId];

  // Build list of (hex, planet) pairs
  const allPlanetPairs = currentMap.hexes.flatMap(hex =>
    hex.planets.map(planet => ({ hex, planet }))
  );

  // Pick random planets
  const chosen = [];
  for (let i = 0; i < count; i++) {
    const pair = allPlanetPairs[Math.floor(Math.random() * allPlanetPairs.length)];
    chosen.push(pair);
  }
  chosen.forEach(({ hex, planet }) => {
    const region = mapRegion[hex.region];

    // Pick a random CPU die
    const dieIds = [...cpu.availableDiceIds];
    if (dieIds.length === 0) return;

    const dieId = dieIds[Math.floor(Math.random() * dieIds.length)];
    const die = currentMap.diceList[dieId];

    // Assign die
    planet.assignedDice.push(die);
    cpu.availableDiceIds.delete(dieId);

    planet.owner = cpuId;
    planet.ownerType = "cpu";
    planet.hasAssignedDice = true;

    hex.ownerType = "cpu";
    hex.hasAssignedDice = true;

    // Influence scoring
    const roll = rollDie(die);

    let sectorGain = calculateInfluenceGain(die, hex.politicalProfile, roll);
    hex.sectorInfluence[cpuId] =
      (hex.sectorInfluence[cpuId] ?? 0) + sectorGain;

    hex.sectorOwner = getSectorOwner(hex);

    let regionGain = calculateInfluenceGain(die, region.politicalProfile, roll);
    region.regionInfluence[cpuId] =
      (region.regionInfluence[cpuId] ?? 0) + regionGain;

    region.owner = getRegionOwner(region);

    // Update political profiles
    setPoliticalProfile(hex, { type: "sector", hex });
    setPoliticalProfile(region, { type: "region", region });
  });
}

function cpuPickPlanet(cpuId) {
  const cpu = currentMap.playersById[cpuId];

  // Build list of (hex, planet) pairs, but ONLY planets with no assigned dice
  const allPlanetPairs = currentMap.hexes.flatMap(hex =>
    hex.planets
      .filter(planet => planet.assignedDice.length === 0)
      .map(planet => ({ hex, planet }))
  );

  if (allPlanetPairs.length === 0) {
    // Fallback: pick any planet
    const fallback = currentMap.hexes.flatMap(hex =>
      hex.planets.map(planet => ({ hex, planet }))
    );
    return fallback[Math.floor(Math.random() * fallback.length)];
  }

  // --- CPU Strategic Mode (70% chance) ---
  if (Math.random() < 0.70) {
    const weighted = allPlanetPairs.map(pair => {
      const sectorInf = pair.hex.sectorInfluence[cpuId] ?? 0;
      const regionInf = mapRegion[pair.hex.region].regionInfluence[cpuId] ?? 0;
      const weight = sectorInf * 2 + regionInf;
      return { ...pair, weight };
    });

    weighted.sort((a, b) => b.weight - a.weight);

    // If the best has any weight, pick it
    if (weighted[0].weight > 0) {
      return weighted[0];
    }

    // Otherwise fallback to random
    return weighted[Math.floor(Math.random() * weighted.length)];
  }

  // --- CPU Expansion Mode (30% chance) ---
  // Pick from sectors where CPU has LOW or ZERO influence
  const lowInf = allPlanetPairs.filter(pair => {
    const sectorInf = pair.hex.sectorInfluence[cpuId] ?? 0;
    return sectorInf < 3; // tweakable threshold
  });

  if (lowInf.length > 0) {
    return lowInf[Math.floor(Math.random() * lowInf.length)];
  }

  // Fallback: random
  return allPlanetPairs[Math.floor(Math.random() * allPlanetPairs.length)];
}

function cpuChooseFaction(hex, region) {
  // Prefer sector profile; fallback to region profile
  const profile = hex.politicalProfile.length > 0
    ? hex.politicalProfile
    : region.politicalProfile;

  // Strongest faction is first in the sorted profile
  const strongestFaction = profile[0];
  const strongestIndex = powers.findIndex(p => p.name === strongestFaction);

  // --- CPU Strategic Variance (21% chance) ---
  if (Math.random() < 0.21) {
    // Three possible alternative choices:
    const altIndices = [
      strongestIndex,                     // same faction
      (strongestIndex - 1 + powers.length) % powers.length, // one step behind
      (strongestIndex - 4 + powers.length) % powers.length  // four steps behind
    ];

    const chosenIndex = altIndices[Math.floor(Math.random() * altIndices.length)];
    return powers[chosenIndex].name;
  }

  // --- Normal CPU Strategy: pick the counter-faction (strongest - 2) ---
  const counterIndex = (strongestIndex - 2 + powers.length) % powers.length;
  return powers[counterIndex].name;
}

function cpuBuyFactionDice(cpuId, factionName) {
  const cpu = currentMap.playersById[cpuId];

  const newDice = generateRandomDice(
    3,              // pack size
    "standard",     // pack type
    factionName,    // forced faction
    cpuId           // owner
  );

  // Add to global diceList
  newDice.forEach(die => {
    currentMap.diceList[die.id] = die;
  });

  return newDice;
}

function cpuPickBestDice(cpuId, factionName) {
  const cpu = currentMap.playersById[cpuId];

  const dice = [...cpu.availableDiceIds]
    .map(id => currentMap.diceList[id]);

  // Score dice by:
  // - matching faction
  // - highest sides
  const scored = dice.map(d => {
    let score = d.sides;
    if (powers[d.power].name === factionName) score += 20;
    return { die: d, score };
  });

  scored.sort((a, b) => b.score - a.score);

  return scored.slice(0, 2).map(s => s.die);
}

function cpuAssignDice(cpuId, hex, planet, dice) {
  const region = mapRegion[hex.region];

  dice.forEach(die => {
    planet.assignedDice.push(die);
    currentMap.playersById[cpuId].availableDiceIds.delete(die.id);

    planet.owner = cpuId;
    planet.ownerType = "cpu";
    planet.hasAssignedDice = true;

    hex.ownerType = "cpu";
    hex.hasAssignedDice = true;

    const roll = rollDie(die);

    let sectorGain = calculateInfluenceGain(die, hex.politicalProfile, roll);
    hex.sectorInfluence[cpuId] =
      (hex.sectorInfluence[cpuId] ?? 0) + sectorGain;

    hex.sectorOwner = getSectorOwner(hex);

    let regionGain = calculateInfluenceGain(die, region.politicalProfile, roll);
    region.regionInfluence[cpuId] =
      (region.regionInfluence[cpuId] ?? 0) + regionGain;

    region.owner = getRegionOwner(region);

    setPoliticalProfile(hex, { type: "sector", hex });
    setPoliticalProfile(region, { type: "region", region });
  });

  //drawSectorMap(hex);
}

function cpuTakeTurn(cpuId) {
  const { hex, planet } = cpuPickPlanet(cpuId);
  const region = mapRegion[hex.region];

  const factionName = cpuChooseFaction(hex, region);

  cpuBuyFactionDice(cpuId, factionName);

  const bestDice = cpuPickBestDice(cpuId, factionName);

  cpuAssignDice(cpuId, hex, planet, bestDice);

  return {
    sectorId: hex.sectorId,
    regionName: hex.region,
    planetName: planet.name,
    factionUsed: factionName
  };
}
