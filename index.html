// ------------------------------
// 1. Simple Perlin Noise
// ------------------------------
class Perlin {
  constructor() { this.gradients = {}; this.memory = {}; }
  rand_vect() { const t = Math.random()*2*Math.PI; return {x:Math.cos(t), y:Math.sin(t)}; }
  dot_prod_grid(x,y,vx,vy){
    let g=this.gradients[[vx,vy]]||(this.gradients[[vx,vy]]=this.rand_vect());
    return (x-vx)*g.x + (y-vy)*g.y;
  }
  smootherstep(x){ return 6*x**5 - 15*x**4 + 10*x**3; }
  interp(x,a,b){ return a + this.smootherstep(x)*(b-a); }
  get(x,y){
    if(this.memory[[x,y]]) return this.memory[[x,y]];
    const xf=Math.floor(x), yf=Math.floor(y);
    const tl=this.dot_prod_grid(x,y,xf,yf);
    const tr=this.dot_prod_grid(x,y,xf+1,yf);
    const bl=this.dot_prod_grid(x,y,xf,yf+1);
    const br=this.dot_prod_grid(x,y,xf+1,yf+1);
    const xt=this.interp(x-xf,tl,tr);
    const xb=this.interp(x-xf,bl,br);
    const v=this.interp(y-yf,xt,xb);
    this.memory[[x,y]]=v;
    return v;
  }
}
const perlin = new Perlin();

// ------------------------------
// 2. Hex math
// ------------------------------
const hexSize = 20;
const sectorHexSize = 50;

function hexToPixel(q, r, size) {
  return {
    x: size * Math.sqrt(3) * (q + r/2),
    y: size * 1.5 * r
  };
}

function drawHex(ctx, x, y, size, color) {
  const angle = Math.PI/3;
  const rotation = Math.PI/6; // 30 degrees

  ctx.beginPath();
  for (let i=0;i<6;i++){
    const px = x + size*Math.cos(angle*i + rotation);
    const py = y + size*Math.sin(angle*i + rotation);
    if(i===0) ctx.moveTo(px,py);
    else ctx.lineTo(px,py);
  }
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();

  ctx.lineWidth = 1;
  ctx.lineJoin = "round";
  ctx.strokeStyle = "black";
  ctx.stroke();
}

function drawSelectedBorder(ctx, x, y, size) {
  const angle = Math.PI / 3;
  const rotation = Math.PI / 6;

  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const px = x + size * Math.cos(angle * i + rotation);
    const py = y + size * Math.sin(angle * i + rotation);
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();

  ctx.lineWidth = 3;
  ctx.strokeStyle = "blue";
  ctx.stroke();
}

function hexDistance(a, b) {
  return (Math.abs(a.q - b.q)
        + Math.abs(a.r - b.r)
        + Math.abs((a.q + a.r) - (b.q + b.r))) / 2;
}

// ------------------------------
// 3. Generate contiguous organic map
// ------------------------------
let currentViewMode = "world"; // "world" or "sector"
let currentSectorView = null;  
let selectedPlanetId = null;

function generateMap() {
  const targetHexCount = 200;
  const noiseScale = 0.2;

  const queue = [];
  const visited = new Set();
  const hexes = [];

  queue.push({q:0, r:0});
  visited.add("0,0");

  while (queue.length > 0 && hexes.length < targetHexCount) {
    const {q, r} = queue.shift();
    const noise = perlin.get(q*noiseScale, r*noiseScale);
    hexes.push({
        q,
        r,
        noise,
        sectorInfluence: 0,
        sectorOwner: null,
        hasAssignedDice: false,
        ownerType: null,
        politicalProfile: ["None", "None", "None"],
        lastPowerActivity: [],
    });

    const neighbors = [
      {q:q+1, r:r},
      {q:q-1, r:r},
      {q:q,   r:r+1},
      {q:q,   r:r-1},
      {q:q+1, r:r-1},
      {q:q-1, r:r+1}
    ];

    neighbors.forEach(n => {
      const key = `${n.q},${n.r}`;
      if (!visited.has(key)) {
        visited.add(key);
        const nNoise = perlin.get(n.q*noiseScale, n.r*noiseScale);
        if (nNoise > -0.3) queue.push(n);
      }
    });
  }

  // ------------------------------
  // 4. Voronoi Regions
  // ------------------------------
  const REGION_COUNT = 5;

  const seeds = [];
  for (let i = 0; i < REGION_COUNT; i++) {
    seeds.push(hexes[Math.floor(Math.random() * hexes.length)]);
  }

  hexes.forEach(hex => {
    let bestSeed = 0;
    let bestDist = Infinity;

    seeds.forEach((seed, index) => {
      const d = hexDistance(hex, seed);
      if (d < bestDist) {
        bestDist = d;
        bestSeed = index;
      }
    });

    hex.region = bestSeed;
  });

  regionInfluence = Array.from({ length: REGION_COUNT }, () => ({
    owner: null,
    influence: 0,
    politicalProfile: ["None", "None", "None"],
    lastPowerActivity: [],
  }));

  // ------------------------------
  // 5. Add planets to each hex (sector)
  // ------------------------------
  
  hexes.forEach((hex, index) => {
    hex.sectorId = index;

    const planetTypes = ["Planet1", "Planet2", "Planet3", "Planet4", "Planet5", "Planet6"];
    const moonTypes   = ["Moon1", "Moon2", "Moon3"];
    const basePlanetCount = Math.floor(Math.random() * 7) + 3; // 3–9
    hex.planets = [];

    let planetIndex = 0;

    for (let i = 0; i < basePlanetCount; i++) {
      const imageId = planetTypes[Math.floor(Math.random() * planetTypes.length)];

      // Create the main planet
      const planet = {
        id: `P-${index}-${planetIndex++}`,
        name: `Planet ${planetIndex}`,
        imageId,
        hasPosition: false,
        assignedDice: [],
        hasAssignedDice: false,
        ownerType: null
      };

      hex.planets.push(planet);

      // --- Special Case: Planet1 gets 1 moon ---
      if (imageId === "Planet1") {
        const moonImage = moonTypes[Math.floor(Math.random() * moonTypes.length)];

        hex.planets.push({
          id: `P-${index}-${planetIndex++}`,
          name: `Moon ${planetIndex}`,
          imageId: moonImage,
          parentId: planet.id,
          hasPosition: false,
          assignedDice: [],
          hasAssignedDice: false,
          ownerType: null
        });
      }

      // --- Special Case: Planet5 gets 4–6 moons ---
      if (imageId === "Planet5") {
        const moonCount = Math.floor(Math.random() * 3) + 4; // 4–6 moons

        for (let m = 0; m < moonCount; m++) {
          const moonImage = moonTypes[Math.floor(Math.random() * moonTypes.length)];

          hex.planets.push({
            id: `P-${index}-${planetIndex++}`,
            name: `Moon ${planetIndex}`,
            imageId: moonImage,
            parentId: planet.id,
            hasPosition: false,
            assignedDice: [],
            hasAssignedDice: false,
            ownerType: null
          });
        }
      }
    }
  });

  return { hexes, REGION_COUNT };
}

// ------------------------------
// 6. Draw map
// ------------------------------
const planetImages = {};
function loadPlanetImages() {
  const ids = [
    "Planet1", "Planet2", "Planet3", "Planet4", "Planet5", "Planet6",
    "Moon1", "Moon2", "Moon3"
  ];

  ids.forEach(id => {
    const img = new Image();
    img.src = `assets/planets/${id}.png`;
    planetImages[id] = img;
  });
}
loadPlanetImages();

function drawMap(mapData) {
  const canvas = document.getElementById("mapCanvas");
  const ctx = canvas.getContext("2d");

  const regionColors = [
    "rgb(180,150,150)",
    "rgb(150,180,150)",
    "rgb(150,150,180)",
    "rgb(180,180,150)",
    "rgb(180,150,180)"
  ];

  ctx.clearRect(0,0,canvas.width,canvas.height);

  mapData.hexes.forEach(hex => {
    const {x,y} = hexToPixel(hex.q, hex.r, hexSize);
    const cx = x + canvas.width/2;
    const cy = y + canvas.height/2;

    const color = regionColors[hex.region];
    drawHex(ctx, cx, cy, hexSize, color);

    hex.pixelX = cx;
    hex.pixelY = cy;

    if (hex.hasAssignedDice) {
      drawOverlayIcon(ctx, cx, cy, hexSize, hex.ownerType);
    }
  });
}

function drawOverlayIcon(ctx, x, y, size, ownerType) {
  const radius = Math.sqrt(size) * 1.7;
  const offsetY = size * 0.45;

  ctx.beginPath();
  ctx.arc(x, y + offsetY, radius, 0, 2 * Math.PI);

  ctx.fillStyle = ownerType === "player" ? "#2F6DB3" : "#8B1E1E";
  ctx.fill();

  ctx.strokeStyle = "#fff";
  ctx.lineWidth = 2;
  ctx.stroke();
}

function drawSectorMap(hex) {
  const canvas = document.getElementById("mapCanvas");
  const ctx = canvas.getContext("2d");

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const planets = hex.planets;


  const mainPlanets = hex.planets.filter(p => !p.parentId);
  const moonPlanets = hex.planets.filter(p => p.parentId);

  const mainCount = mainPlanets.length;

  // radius of the main ring
  const mainRadius = 2; // axial distance

  mainPlanets.forEach((planet, i) => {
    const angle = (2 * Math.PI * i) / mainCount;

    // convert angle → axial coordinates
    const q = Math.round(mainRadius * Math.cos(angle));
    const r = Math.round(mainRadius * Math.sin(angle));

    if (!planet.hasPosition) {
      const spot = findFreeSpot(hex.planets, q, r);
      planet.q = spot.q;
      planet.r = spot.r;
      planet.hasPosition = true;
    }
  });

  moonPlanets.forEach((moon, i) => {
    const parent = hex.planets.find(p => p.id === moon.parentId);

    const moonIndex = i; // or use a counter per parent
    const moonCount = moonPlanets.filter(m => m.parentId === parent.id).length;

    const angle = (2 * Math.PI * moonIndex) / moonCount;

    const moonRadius = 1; // small ring around parent

    let q = parent.q + Math.round(moonRadius * Math.cos(angle));
    let r = parent.r + Math.round(moonRadius * Math.sin(angle));

    if (!moon.hasPosition) {
      const spot = findFreeSpot(hex.planets, q, r);
      moon.q = spot.q;
      moon.r = spot.r;
      moon.hasPosition = true;
    }
  });

  hex.planets.forEach(planet => {
    const { x, y } = hexToPixel(planet.q, planet.r, sectorHexSize);

    planet.pixelX = x + canvas.width / 2;
    planet.pixelY = y + canvas.height / 2;

    // draw hex
    const isSelected = (planet.id === selectedPlanetId);
    const fillColor = isSelected ? "#777" : "#333";

    drawHex(ctx, planet.pixelX, planet.pixelY, sectorHexSize, fillColor);

    const img = planetImages[planet.imageId];
    if (img.complete) {
      ctx.drawImage(
        img,
        planet.pixelX - sectorHexSize * 0.6,
        planet.pixelY - sectorHexSize * 0.6,
        sectorHexSize * 1.2,
        sectorHexSize * 1.2
      );
    } else {
      img.onload = () => {
        ctx.drawImage(
          img,
          planet.pixelX - sectorHexSize * 0.6,
          planet.pixelY - sectorHexSize * 0.6,
          sectorHexSize * 1.2,
          sectorHexSize * 1.2
        );
      };
    }

    if (isSelected) {
      drawSelectedBorder(ctx, planet.pixelX, planet.pixelY, sectorHexSize);
    }

    if (planet.hasAssignedDice) {
      drawOverlayIcon(ctx, planet.pixelX, planet.pixelY, sectorHexSize, planet.ownerType);
    }
  });

  drawBackArrow(ctx);
}
function isOccupied(planets, q, r) {
  return planets.some(p => p.q === q && p.r === r);
}
function findFreeSpot(planets, q, r) {
  if (!isOccupied(planets, q, r)) return { q, r };

  // Spiral search outward
  const directions = [
    {q: 1, r: 0}, {q: 1, r: -1}, {q: 0, r: -1},
    {q: -1, r: 0}, {q: -1, r: 1}, {q: 0, r: 1}
  ];

  let radius = 1;

  while (radius < 10) { // safe limit
    for (let d = 0; d < 6; d++) {
      for (let step = 0; step < radius; step++) {
        q += directions[d].q;
        r += directions[d].r;

        if (!isOccupied(planets, q, r)) {
          return { q, r };
        }
      }
    }
    radius++;
  }

  // fallback (should never happen)
  return { q: q + 1, r };
}



function drawBackArrow(ctx) {
  ctx.fillStyle = "#fff";
  ctx.font = "24px sans-serif";
  ctx.fillText("⬅", 20, 40);

  // store clickable area
  window.backArrowBounds = { x: 20, y: 20, w: 40, h: 40 };
}

// ------------------------------
// 7. Click interaction
// ------------------------------
function getHexAtPixel(mapData, px, py) {
  for (const hex of mapData.hexes) {
    const dx = px - hex.pixelX;
    const dy = py - hex.pixelY;
    const dist = Math.sqrt(dx*dx + dy*dy);

    if (dist < hexSize * 1.1) {
      return hex;
    }
  }
  return null;
}

function getPlanetAtPixel(hex, px, py, size) {
  for (const planet of hex.planets) {
    const dx = px - planet.pixelX;
    const dy = py - planet.pixelY;
    const dist = Math.sqrt(dx*dx + dy*dy);

    if (dist < size) return planet;
  }
  return null;
}

function setupClick(mapData) {
  const canvas = document.getElementById("mapCanvas");
  const info = document.getElementById("hexInfo");

  canvas.onclick = (e) => {
    const rect = canvas.getBoundingClientRect();
    const px = e.clientX - rect.left;
    const py = e.clientY - rect.top;

    if (currentViewMode === "world") {
      const hex = getHexAtPixel(mapData, px, py);

      if (hex) {
        currentViewMode = "sector";
        currentSectorView = hex;

        renderSectorInfo(hex); // Existing text panel, contains Back Button. Will eventually be obsolete.
        drawSectorMap(hex);
      };
    } else if (currentViewMode === "sector") {
      const b = window.backArrowBounds;
      if (px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h) {
        returnToWorldMap();
        return;
      }

      // Planet clicks
      const planet = getPlanetAtPixel(currentSectorView, px, py, sectorHexSize);
      if (planet) {
        viewPlanet(currentSectorView.sectorId, planet.id);
        selectedPlanetId = planet.id;
        drawSectorMap(currentSectorView);
        return;
      }
    }
  }

  canvas.addEventListener("mousemove", (e) => {
    const rect = canvas.getBoundingClientRect();
    const px = e.clientX - rect.left;
    const py = e.clientY - rect.top;
    const pagx = e.pageX;
    const pagy = e.pageY;

    handleHover(px, py, pagx, pagy);
  });
}

function handleHover(px, py, pagx, pagy) {
  const tooltip = document.getElementById("hoverTooltip");

  if (currentViewMode === "world") {
    const hex = getHexAtPixel(currentMap, px, py);
    if (hex) {
      tooltip.style.display = "block";
      tooltip.style.left = (pagx - 150) + "px";
      tooltip.style.top = (pagy - 100) + "px";

      tooltip.innerHTML = `
        <strong>Sector ${hex.sectorId}</strong><br>
        Region: ${hex.region}<br>
        <hr />
        <strong>Region Control</strong><br>
        Owner: ${regionInfluence[hex.region].owner ?? "None"}<br>
        Influence: ${regionInfluence[hex.region].influence}<br>
        <hr />
        <strong>Sector Control</strong><br>
        Num Planets: ${hex.planets.length}<br>
        Owner: ${hex.sectorOwner ?? "None"}<br>
        Influence: ${hex.sectorInfluence}
      `;
      return;
    }
  }

  if (currentViewMode === "sector") {
    const planet = getPlanetAtPixel(currentSectorView, px, py, sectorHexSize);

function pickWeightedDie(weights) {
  const roll = Math.random();
  let cumulative = 0;

  for (const entry of weights) {
    cumulative += entry.weight;
    if (roll <= cumulative) {
      return entry.sides;
    }
  }

  // fallback (should never hit)
  return weights[0].sides;
}

function generateRandomDice(count = 10, packType = "standard", forcedFaction = null) {
  const dice = [];
  const pack = dicePackTypes[packType];

  for (let i = 0; i < count; i++) {
    const sides = pickWeightedDie(pack.weights);

    // If faction is forced, find the matching power entry
    let powerIndex;
    if (forcedFaction) {
      powerIndex = powers.findIndex(p => p.name === forcedFaction);
    } else {
      powerIndex = Math.floor(Math.random() * powers.length);
    }

    const power = powers[powerIndex];

    dice.push({
      id: `D-${Date.now()}-${i}`,
      sides,
      power: powerIndex,
      ownerId: "player",
      name: `${power.name} d${sides}`,
      color: power.color
    });
  }

  return dice;
}

function assignDiceToPlanet(sectorId, planetId) {
  diceSelectionContext = {
    sectorId,
    planetId,
    selectedCategories: []
  };

  showAvailableDice(true); // selection mode
}

function confirmDiceAssignment() {
  const ctx = diceSelectionContext;
  if (!ctx) return;

  const hex = currentMap.hexes.find(h => h.sectorId == ctx.sectorId);
  const planet = hex.planets.find(p => p.id == ctx.planetId);

  ctx.selectedCategories.forEach(cat => {
    const { powerIndex, sizeIndex } = cat;

    const sizes = [4, 6, 8, 10, 12, 20];
    const targetSize = sizes[sizeIndex];

    // Find all matching dice
    const candidates = currentMap.availableDice.filter(d =>
      d.power === powerIndex && d.sides === targetSize
    );

    if (candidates.length > 0) {
      // Pick one (random for now)
      const die = candidates[Math.floor(Math.random() * candidates.length)];

      // Assign it
      planet.assignedDice.push(die);
      if (planet.assignedDice.length > 0) {
        hex.hasAssignedDice = true;
        hex.ownerType = "player";
        planet.hasAssignedDice = true;
        planet.ownerType = "player";
        drawSectorMap(hex);
      }

      // Remove from available pool
      currentMap.availableDice = currentMap.availableDice.filter(d => d.id !== die.id);

      // ⭐ Add scoring
      let sectorGain = calculateSectorInfluenceGain(die, hex);
      hex.sectorInfluence += sectorGain;
      hex.sectorOwner = "Player";

      let regionGain = calculateRegionInfluenceGain(die, hex.region);
      regionInfluence[hex.region].influence += regionGain;
      regionInfluence[hex.region].owner = "Player";
    }
  });

  diceSelectionContext = null;

  if (hex.sectorOwner === "Player") {
    setSectorPoliticalProfile(hex);
  }
  if (regionInfluence[hex.region].owner === "Player") {
    setRegionPoliticalProfile(hex.region);
  }

  viewPlanet(ctx.sectorId, ctx.planetId);
}

function calculateInfluenceGainCore(die, profile) {
  let max = die.sides;
  let roll = Math.floor(Math.random() * max) + 1;

  let debug = `Initial Roll: ${roll}\n`;

  // Convert faction names to indices
  const profileIndices = profile.map(name =>
    powers.findIndex(p => p.name === name)
  );

  let modifiedRoll = roll;

  profileIndices.forEach(profilePowerIndex => {
    if (profilePowerIndex === -1) {
      debug += `No faction in this profile seat.\n`;
      return;
    }

    const result = determineWinner(die.power, profilePowerIndex);

    const dieName = powers[die.power].name;
    const profileName = powers[profilePowerIndex].name;

    if (result === "player") {
      modifiedRoll *= 2;
      debug += `${dieName} beats ${profileName}: ${modifiedRoll}\n`;
    } else if (result === "cpu") {
      modifiedRoll /= 2;
      debug += `${dieName} loses to ${profileName}: ${modifiedRoll}\n`;
    } else {
      debug += `${dieName} ties ${profileName}: ${modifiedRoll}\n`;
    }
  });

  modifiedRoll = Math.max(1, Math.floor(modifiedRoll));

  debug += `Final Influence Gain: ${modifiedRoll}`;
  alert(debug);

  return modifiedRoll;
}
function calculateSectorInfluenceGain(die, hex) {
  return calculateInfluenceGainCore(die, hex.politicalProfile);
}
function calculateRegionInfluenceGain(die, regionIndex) {
  return calculateInfluenceGainCore(die, regionInfluence[regionIndex].politicalProfile);
}

function setSectorPoliticalProfile(hex) {
  const strengths = powers.map((p, index) =>
    getFactionStrength({ type: "sector", hex }, index)
  );

  setPoliticalProfileForEntity(hex, strengths);
}
function setRegionPoliticalProfile(regionIndex) {
  const strengths = powers.map((p, index) =>
    getFactionStrength({ type: "region", regionIndex }, index)
  );

  setPoliticalProfileForEntity(regionInfluence[regionIndex], strengths);
}


function setPoliticalProfileForEntity(entity, strengths) {
  // 1. Gather strength for each power
  const total = strengths.reduce((a, b) => a + b, 0);

  // If no dice, clear profile
  if (total === 0) {
    entity.politicalProfile = ["None", "None", "None"];
    return;
  }

  // 2. Droop quota
  const quota = Math.round(total / 4);

  // 3. Guaranteed seats + remainders
  const guaranteed = strengths.map(s => Math.floor(s / quota));
  const remainders = strengths.map(s => s % quota);

  // 4. Collect guaranteed seats
  let seats = [];
  guaranteed.forEach((count, index) => {
    for (let i = 0; i < count; i++) {
      seats.push(powers[index].name);
    }
  });

  // 5. Fill remaining seats using remainder only (for now)
  if (seats.length < 3) {
    const remaining = powers
      .map((p, index) => ({ name: p.name, remainder: remainders[index], index }))
      .sort((a, b) => b.remainder - a.remainder);

    const seatsNeeded = 3 - seats.length
    for (let i = 0; i < seatsNeeded; i++) {
      seats.push(remaining[i].name);
    }
  }

  // 6. Store final profile
  entity.politicalProfile = seats.slice(0, 3);
}

function getFactionStrength(scope, powerIndex) {
  let total = 0;

  if (scope.type === "sector") {
    // scope.hex is the sector hex
    scope.hex.planets.forEach(planet => {
      planet.assignedDice.forEach(d => {
        if (d.power === powerIndex) {
          total += d.sides;
        }
      });
    });
  }

  if (scope.type === "region") {
    // scope.regionIndex tells us which region
    currentMap.hexes.forEach(hex => {
      if (hex.region === scope.regionIndex) {
        hex.planets.forEach(planet => {
          planet.assignedDice.forEach(d => {
            if (d.power === powerIndex) {
              total += d.sides;
            }
          });
        });
      }
    });
  }

  return total;
}

function showDiceCollection() {
  if (!currentMap || !currentMap.playerDice) {
    document.getElementById("hexInfo").innerHTML = "<p>No dice available.</p>";
    return;
  }

  // Die sizes (columns)
  const sizes = [4, 6, 8, 10, 12, 20];

  // Initialize matrix: 7 powers × 6 sizes
  const matrix = Array.from({ length: powers.length }, () =>
    Array.from({ length: sizes.length }, () => 0)
  );

  // Count dice
  currentMap.playerDice.forEach(die => {
    const powerIndex = die.power;
    const sizeIndex = sizes.indexOf(die.sides);
    if (sizeIndex !== -1) {
      matrix[powerIndex][sizeIndex]++;
    }
  });

  // Build HTML table
  let html = `
    <h3>Dice Collection</h3>
    <table style="border-collapse: collapse; text-align: center;">
      <tr>
        <th style="padding: 6px; border: 1px solid #555;"></th>
        ${sizes.map(s => `<th style="padding: 6px; border: 1px solid #555;">d${s}</th>`).join("")}
      </tr>
  `;

  matrix.forEach((row, powerIndex) => {
    html += `
      <tr>
        <td style="padding: 6px; border: 1px solid #555; color:${powers[powerIndex].color}; font-weight:bold;">
          ${powers[powerIndex].name}
        </td>
        ${row.map(count => `
          <td style="padding: 6px; border: 1px solid #555;">${count}</td>
        `).join("")}
      </tr>
    `;
  });

  html += "</table>";

  document.getElementById("hexInfo").innerHTML = html;
}

  if (!currentMap || !currentMap.availableDice) {
    info.innerHTML = "<p>No available dice.</p>";
    return;
  }

  const sizes = [4, 6, 8, 10, 12, 20];

  // Build matrix of dice lists
  const matrix = Array.from({ length: powers.length }, () =>
    Array.from({ length: sizes.length }, () => [])
  );

  currentMap.availableDice.forEach(die => {
    const powerIndex = die.power;
    const sizeIndex = sizes.indexOf(die.sides);
    matrix[powerIndex][sizeIndex].push(die);
  });

  let html = `

      <tr>

  matrix.forEach((row, powerIndex) => {
    html += `

          ${powers[powerIndex].name}

        ${row.map((diceList, sizeIndex) => `

            ${diceList.length > 0 ? diceList.length : ""}

function toggleDiceCategorySelection(powerIndex, sizeIndex) {
  const ctx = diceSelectionContext;
  if (!ctx) return;

  const key = `${powerIndex}-${sizeIndex}`;
  const existing = ctx.selectedCategories.find(c => c.key === key);

  if (!existing) {
    if (ctx.selectedCategories.length < 3) {
      ctx.selectedCategories.push({ key, powerIndex, sizeIndex });
    } else {
      alert("You can only assign up to 3 dice.");
      // Uncheck the box
      document.querySelector(`input[onchange="toggleDiceCategorySelection(${powerIndex}, ${sizeIndex})"]`).checked = false;
    }
  } else {
    ctx.selectedCategories = ctx.selectedCategories.filter(c => c.key !== key);
  }
}

  influenceDiv = document.getElementById("influence");

  buttonsDiv.innerHTML = "";
  linesGroup.innerHTML = "";
  resultDiv.innerHTML = "";
  influenceDiv.innerHTML = ""

  placeButtons();
  drawArrows();
}

// ------------------------------
// 14. Game Management
// ------------------------------
let currentMap = null;

function newGame() {
  enableTopButtonsAfterGameStart();
  currentMap = generateMap();
  currentMap.playerDice = generateRandomDice(10, "standard");
  currentMap.availableDice = [...currentMap.playerDice];
  drawMap(currentMap);
  setupClick(currentMap);

  document.getElementById("hexInfo").innerHTML = `
    <h3>Welcome to Stellar Mandate!</h3>
    <p>To get started, explore the galaxy by clicking on a hex on the map to the right. This is a Sector, where you will find planets ripe for conquest!</P>
    <p>Deploy your forces to the planets there to gain influence and claim ownership over Sectors or entire Regions!</p>
    <p>Play games to earn Credits, which can be used to purchase new dice packs that you can then assign to planets to gain even more influence!</p>
    <h3>Starting Dice</h3>
    <ul>
        ${currentMap.playerDice.map(d => 
        `<li style="color:${d.color}; font-weight:bold;">
            ${d.name}
        </li>`
        ).join("")}
    </ul>
  `;

  playerCredits = 500; // starting money
  updateCurrencyDisplay();
}

function saveGame() {
  if (!currentMap) return alert("No map to save.");
  localStorage.setItem("savedMap", JSON.stringify(currentMap));
  localStorage.setItem("regionInfluence", JSON.stringify(regionInfluence));
  localStorage.setItem("playerCredits", JSON.stringify(playerCredits));
  alert("Game saved.");
}

function loadGame() {
  const saved = localStorage.getItem("savedMap");
  if (!saved) return alert("No saved game found.");

  enableTopButtonsAfterGameStart();

  currentMap = JSON.parse(saved);
  regionInfluence = JSON.parse(localStorage.getItem("regionInfluence"));
  playerCredits = JSON.parse(localStorage.getItem("playerCredits")) ?? 500;
  drawMap(currentMap);
  setupClick(currentMap);

  if (currentMap.playerDice) {
    document.getElementById("hexInfo").innerHTML = `
      <h3>Loaded Dice</h3>
      <ul>
        ${currentMap.playerDice.map(d => 
            `<li style="color:${d.color}; font-weight:bold;">
                ${d.name}
            </li>`
        ).join("")}
      </ul>
    `;
  }

  updateCurrencyDisplay();
}

function resetGame() {
  localStorage.removeItem("savedMap");
  localStorage.removeItem("regionInfluence");
  localStorage.removeItem("playerCredits");
  currentMap = null;
  playerCredits = 0;
  updateCurrencyDisplay();

  const canvas = document.getElementById("mapCanvas");
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0,0,canvas.width,canvas.height);

  document.getElementById("hexInfo").innerHTML = "";
  alert("Game reset.");
}

</script>
